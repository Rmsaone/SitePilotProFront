services:
  front:
    build:
      context: .
      target: dev
    ports:
      - '${FRONT_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - '.:/app'
      - '/app/node_modules'
      - '/app/.nuxt'

  front-prod:
    profiles: [prod]
    build:
      context: .
      target: prod
    ports:
      - '${FRONT_PROD_PORT:-8080}:80'
